# The goal, machine-readable: the single source of every number in GOAL.md. The tests in goaltests/
# read this file; GT-1 checks that GOAL.md says the same. Percentages are of account equity.

[meta]
version = "4"
status = "revised after the goal tests and an independent review of version 2; awaiting the owner's decisions"
date = "2026-10-15"

[intent]
mission = "An autonomous system that trades liquid US stocks and ETFs, long and short, holding each position from seconds up to five trading days. It makes money after every cost, earns a return beyond what the market's moves and chance would give, and never breaks its risk limits. It proves this on history it was not built on, then on a paper account, before any real money. Real money starts with a fraction of the intended capital and grows only while the evidence holds."
viewpoint = "owner"
non_goals = [
  "market making and latency arbitrage: competing on speed with firms that sit next to the exchange",
  "options, futures, crypto, currencies, OTC securities, and leveraged or inverse ETFs",
  "short sales of hard-to-borrow stocks",
  "orders outside the regular session, 09:30 to 16:00 New York time",
  "positions held longer than 5 trading days or 7 calendar days",
  "leverage: gross exposure above 100% of equity",
  "a promised return: the goal fixes how results are judged, not what they will be",
  "the system's architecture, data sources and code, which are decided after the goal; the owner's design wishes are recorded below for that stage",
  "tax optimization",
]

[[stakeholders]]
id = "S1"
name = "Owner"
needs = ["a system that trades by itself all day", "money made after costs", "no real money until paper trading proves it",
         "a daily account of what was done and why, and live profit and loss", "a way to stop everything at once",
         "strategies reviewed every week and changed only outside trading hours"]

[[stakeholders]]
id = "S2"
name = "Broker (Alpaca)"
needs = ["orders within its margin, short-sale and rate rules", "positions reconciled with its records"]

[[stakeholders]]
id = "S3"
name = "Market and regulators"
needs = ["orderly markets", "no manipulative orders", "accurate records"]

[[stakeholders]]
id = "S4"
name = "Independent reviewer"
needs = ["evidence that can be reproduced", "every strategy variant tried, logged", "a say before each gate"]

# How the owner pictured the system. Not part of the goal (they say how, not what); the architecture
# stage starts from them, within the goal.
[owner_design_wishes]
items = [
  "an AI model does the slower thinking; fast code makes the split-second calls",
  "scans the whole market all day and watches a shortlist live",
  "a risk manager with fixed limits can block any trade, and nothing overrides it",
  "shows live profit and loss",
  "never a Fable model, in any role",
]

[constraints]
starting_equity_usd = 100000        # the paper account's default; confirm on day one; limits are in % of equity
max_holding_trading_days = 5        # the owner: seconds, minutes, hours or days, up to five days, never weeks
max_holding_calendar_days = 7
directions = ["long", "short"]
order_session = "regular"
hold_through_earnings = false        # no position held through its issuer's scheduled earnings release
universe_min_price_usd = 5
universe_min_dollar_volume_usd = 20000000   # 20-day median daily dollar volume
universe_max_spread_bps = 10                # 20-day median quoted spread
max_position_adv_pct = 0.02                 # one position at most this % of its name's 20-day median dollar volume (GT-3)
min_equity_for_shorts_usd = 2000            # Alpaca allows margin and short sales only from $2,000 of equity
max_short_interest_pct = 15                 # a short only where short interest is at most this % of the float
max_days_to_cover = 5                       # and short interest is at most this many days of average volume
short_ex_date_max_pct = 0.5                 # no short held over an ex-date of a distribution of this % of the price or more
etb_loss_close_minutes = 30                 # a held short that loses easy-to-borrow status is closed this soon after the next open
models_text = "no Fable model (claude-fable-*) is used in any role: the system's decisions, research, the independent review, monitoring, operations, or building the system"
universe_text = "US-listed operating-company common stocks (not ADRs, SPACs, closed-end funds, units, rights or warrants) and ETFs registered under the Investment Company Act that hold listed stocks, meeting the price, dollar-volume and spread limits; leveraged and inverse ETFs, commodity pools, crypto trusts, volatility-linked products and ETNs are excluded"
shorts_text = "a short is sent only with a current easy-to-borrow status (a locate), never under the Rule 201 short-sale price test, and only within the short-interest limits"
events_text = "no position is held through a scheduled company event: an earnings release, an FDA action date, a trial readout, a shareholder vote or a lockup expiry; nor through the ex-date or effective date of any corporate action other than an ordinary cash dividend"

[risk]
risk_per_position_pct = 0.5          # the most one position may lose at its stop, all its fills together
min_position_risk_pct = 0.1          # and the least it risks when it opens: with the open-risk cap, at most 20 positions at entry
stop_required = true                 # every share held is covered by a stop from the moment it is bought or sold short
max_open_risk_per_side_pct = 1.5     # sum of the losses at the stops of all open longs; the same for all shorts
max_open_risk_pct = 2.0              # the same sum over every open position, long and short
# no fixed number of positions: the limits in this section bound the book, and [activity] rotation_text
# says what happens when a better candidate meets a full book
max_position_pct = 10                # notional of one position: a 20% jump within the session costs 2%
typical_position_pct = 4             # planning value (GT-2, GT-3)
max_position_overnight_pct = 4       # one stock held overnight, long or short: a 50% jump costs 2%
max_overnight_etf_pct = 10           # one broad, unleveraged index fund held overnight: a 20% jump costs 2%
max_overnight_event_prone_pct = 2    # one event-prone position held overnight (event_prone_text): a 100% jump costs 2%
jump_overnight_pct = 50              # the jump a position held overnight or through a halt must survive (Yahoo +49.5%, 2008)
jump_intraday_pct = 20               # the jump within the session: two 10% price bands, or a news halt
jump_overnight_etf_pct = 20          # a broad index fund overnight: above the 13% market gap of the level-2 circuit breaker
jump_overnight_event_prone_pct = 100 # an event-prone position overnight: a doubling against a short, a total loss on a long
max_jump_loss_pct = 4                # no single jump event, in one name or one industry, loses more (a total loss of one position)
max_overnight_industry_pct = 8       # held overnight in one industry, long plus short
max_overnight_gross_pct = 75         # all positions held overnight, long plus short
max_overnight_net_pct = 15           # held overnight, beta-adjusted long minus short: a 13% market gap costs 1.95%
max_gross_exposure_pct = 100         # long plus short, at every moment
daily_loss_limit_pct = 2.0           # then flat and no new entries until the next session
max_day_loss_pct = 2.5               # no day loses more, gaps and slippage while closing included (KR2.3)
max_drawdown_halt_pct = 9.0          # then flat and halted until the owner decides
max_drawdown_pct = 10.0              # equity never falls this far below its peak (KR2.2)
drawdown_room_margin_pct = 0.5       # kept between the worst jump the assumptions allow and max_drawdown_pct (drawdown_room_text)
vol_target_daily_pct = 0.2           # P&L volatility that sizing aims for, per day
vol_measured_over_days = 5           # measured on 5-day P&L and scaled by the square root of 5
vol_max_multiple = 1.5               # realized volatility over any 60 trading days stays within this multiple of the target
leverage_text = "gross exposure, long plus short, at most 100% of equity"
trapped_text = "a position that cannot be traded at the moment: its stock halted or paused, no session open, or the broker unreachable; it gets an exit order at the first chance, and the owner is alerted"
market_halt_text = "after a market-wide trading halt, gross exposure is cut to the overnight limits as soon as trading resumes, before any new entry"
loss_basis_text = "the daily loss counts from the previous session's closing equity, so an overnight gap counts against it; the drawdown counts from the highest equity reached, marked to market"
safe_state_text = "no new orders, open entry orders cancelled, every position keeps a stop that takes effect without the system, and the owner alerted"
etf_text = "a broad index fund: an unleveraged exchange-traded fund tracking a broad US equity index (such as the S&P 500, the Nasdaq-100, the Russell 2000 or a total-market index); a leveraged, inverse, sector or single-stock fund is a stock for these limits"
event_prone_text = "an event-prone position: a short in a biotechnology or pharmaceutical company, whose stock a regulatory decision or a takeover can double overnight; a long in a bank or other deposit-funded lender whose stock or industry has fallen 20% or more over the last 5 trading days, which a run can wipe out (SVB, March 2023)"
drawdown_room_text = "at every moment, the loss the jump assumptions allow from the worst single event (one position through its jump, a total loss of one stock held overnight, one industry through its jump, or the overnight book through a 13% market gap) is at most max_drawdown_pct less the current drawdown less drawdown_room_margin_pct; positions shrink as the drawdown deepens, so no jump within the assumptions carries equity past max_drawdown_pct"

[costs]
round_trip_cost_bps = 8              # planning average; each trade is charged its own costs, below
slippage_bps_per_side = 1.5
stress_cost_multiplier = 1.5         # every cost 50% higher (GT-3: at the planned activity, x2 leaves no room for the targeted strategy)
cost_text = "every fill is charged from the mid-price at the decision time: a market order pays the half-spread plus the slippage; a limit order pays the distance from that mid to its limit; sales pay the SEC and FINRA fees; a short held overnight pays the broker's borrow fee; dividends are credited on longs and charged on shorts at the ex-date"
history_borrow_text = "in G1, shorts only in names a stated historical proxy shows as borrowable at the time, charged a borrow cost of g1_borrow_cost_pct_per_year"
g1_borrow_cost_pct_per_year = 0.5
fill_model_text = "conservative: a limit order fills only when the price trades through its limit; a market order fills at the far side of the quote at the decision time, plus slippage"

[activity]
min_risk_trades_per_week = 10        # a review trigger, never a reason to trade
planned_risk_trades_per_week = 25
typical_holding_minutes = 1170       # three trading days
cost_budget_pct_per_year = 4.5       # costs paid, as % of equity per year: just above the planned 4.2%, where G1's power still holds
entry_min_gain_to_cost = 2           # a position opens only when its expected gain is at least this multiple of its expected cost
risk_bearing_min_risk_pct = 0.1      # a round trip counts as risk-bearing when its loss at the stop is at least this
activity_text = "the system evaluates the eligible universe every minute of the regular session; the entry rule is never relaxed to meet the activity floor"
rotation_margin_to_cost = 1          # a rotation's advantage, after the candidate's round-trip cost, is at least this multiple of that cost
rotation_min_hold_minutes = 15       # a position is not replaced sooner than this after opening
rotation_min_hold_fraction = 0.2     # nor within this share of its planned holding time, whichever is longer
max_rotations_per_day = 3
max_rotation_share = 0.2             # of the round trips of the last 5 trading days; rotations count inside the planned activity
rotation_review_count = 30           # on paper and live, the weekly review judges rotation on the latest this many
rotation_text = "the number of positions is not fixed: the book holds every position the limits allow. When a candidate can't open because a limit is full, it may take the place of held positions, whole or in part, the lowest-valued first, when its value exceeds theirs by at least rotation_margin_to_cost times its round-trip cost and by at least one standard deviation of the error in such comparisons, measured on past rotations, and when it has done so at two consecutive evaluations. A candidate's value is its expected gain less its round-trip cost, less what a typical new entry would earn on the risk and the time it would occupy. A held position's value is its expected remaining gain, re-estimated from its signal now and never from its profit or loss since entry, less the same charge for its remaining time, less any extra cost of closing it before its planned exit; its own closing cost is not counted, since it is paid either way. A position is not replaced within rotation_min_hold_minutes or rotation_min_hold_fraction of its planned hold, whichever is longer; there are at most max_rotations_per_day rotations a day and at most max_rotation_share of the round trips of the last 5 trading days; a name replaced is not re-entered the same day, and no rotation closes and reopens the same name in the same direction; there is no rotation while the market's median spread or volatility is above its 90th percentile of the last year. Every rotation records both values, and the position closed is followed to its planned exit as if it had been held, so each rotation's realized value is known: the new position's result less the closed one's forgone result. The expected gains both rules use are calibrated on the trades those rules select, since the highest of 1,000 to 2,000 forecasts is inflated by its own selection"

[returns]
min_net_excess_sharpe = 1.0          # annualized; below this a strategy is not worth running
target_net_excess_sharpe = 1.5       # annualized; what the gates are sized to detect
min_net_excess_return_pct = 3        # a year: Sharpe 1.0 at the volatility budget
target_net_excess_return_pct = 5     # a year: Sharpe 1.5 at the volatility budget
planned_edge_horizon_minutes = 780   # the plan expects the edge from holds of 2 trading days or more, held overnight (GT-3); a planning basis, not a limit
require_net_profit = true            # excess return is not enough: the account must also make money
excess_text = "the net daily return, without interest on cash or short proceeds but with dividends and borrow fees, minus for each position its weight times its 252-day beta to SPY (as of the previous close) times SPY's total return over the same interval the position was held, overnight and intraday separately; no risk-free rate is subtracted"

[evaluation]
prior_edge_probability = 0.05        # chance a new candidate has a real net edge before testing (GT-8)
prior_edge_sr_max = 2.0              # a real edge's net Sharpe is equally likely anywhere up to this
prior_edge_sr_max_harsh = 1.25       # the same, for the sensitivity GT-8 reports
min_posterior = 0.80                 # a strategy that passes G1 and G2 has a real edge
min_posterior_worth_running = 0.70   # and is worth running (Sharpe at least the minimum)
published_edge_multiplier = 0.42     # published effects count at most at what remains after publication (McLean-Pontiff)
max_false_pass_g1 = 0.01
max_false_pass_g2 = 0.50             # paper trading can't tell a small edge from luck in 120 days: half of no-edge strategies make money
max_false_real_money = 0.005
min_power = 0.75                     # each gate passes the targeted edge at least this often: 5 points of power traded for twice as many ideas (decision 5)
max_false_halt_per_year = 0.10
assumed_trials = 20                  # the variant budget for the whole program on one data history
assumed_cost_drag_daily_pct = 0.017  # 25 trades a week x 4% x 8 bps = 4.2% a year
assumed_implementation_noise = 0.15  # daily difference between paper and a rerun of the same strategy, as a share of its volatility
fidelity_detect_sr = 1.0             # G2 must catch an execution shortfall this large (Sharpe units a year)
min_fidelity_power = 0.80
max_false_stop_3y = 0.12             # the live test stops the targeted edge by mistake within 3 years at most this often
min_dead_halve_1y = 0.50             # and halves a strategy whose edge is gone within a year at least this often
min_dead_stop_3y = 0.65              # and stops it within 3 years at least this often
simulation_reps = 400

[kill_criteria]
max_research_cycles = 4              # stages of 3 months; each stage's ideas are registered before its G1 runs
max_variants_per_cycle = 5
max_variants_per_idea = 2            # so at least 10 distinct ideas get a test
max_variants = 20                    # the binding total
max_research_months = 12
drawdown = "a fall of max_drawdown_halt_pct from peak halts trading until the owner decides"
no_edge = "if no strategy passes G1 within the research budget, the program stops instead of trading anyway; it restarts only if the owner decides, and only on data after the last G1 test (a fresh 2,400-day test needs about 9.5 years of it). The budget is final: never extended because a variant nearly passed"

[measurement]
mark_text = "positions are marked at the consolidated mid-price; a quote older than data_max_age_seconds keeps its last valid mid; a halted name is marked at its last trade and flagged"
equity_text = "the equity of record is the paper or live account revalued with the conservative fill model and corrected for any corporate action the broker's paper account did not apply, computed every minute"
overnight_check_minutes_before_close = 15   # overnight limits are measured this long before the close (15:45, or 12:45 on early-close days)
passive_cure_minutes = 15                   # a limit exceeded by price moves alone must be back within it this soon, or it counts as a breach

[order_limits]
price_collar_pct = 1                 # a risk-increasing order is a limit order at most this far through the national best bid or offer
max_spread_multiple = 3              # and is sent only when the spread is at most this multiple of the name's median spread
max_order_participation_pct = 10     # an order at most this % of the volume expected while it works
duplicate_window_seconds = 5         # an order identical to one sent this recently is blocked
max_orders_per_second = 2
max_orders_per_minute = 120
max_orders_per_fill = 10
alert_seconds = 60
data_gap_seconds = 30
data_max_age_seconds = 5
limit_warning_fraction = 0.8         # the owner is warned when a limit reaches this share of its threshold
alert_repeat_minutes = 5             # an alert not acknowledged by then is repeated through a second channel
unacknowledged_alert_minutes = 15    # a warning not acknowledged by then stops new entries until it is
unacknowledged_flatten_minutes = 60  # a fault not acknowledged by then closes every position (fault_text)
flatten_cutoff_new_york = "15:45"    # or at this time, if earlier: closing orders are sent while the session is open
stop_check_seconds = 60              # after a fault, every position's stop is confirmed at the broker within this time
fault_text = "a fault is an alert that the system itself may be wrong: an order or fill the system did not send (the kill switch fires at once), a reconciliation mismatch, an order of unknown state, data older than data_gap_seconds, a lost connection, a restart, or orders rejected repeatedly. A fault puts the system in the safe state at once; within stop_check_seconds every position's stop is confirmed from the broker's own records and a position without a working stop is closed at once; unacknowledged, it closes every position after unacknowledged_flatten_minutes or at flatten_cutoff_new_york, whichever comes first, and the system stays stopped until the owner acknowledges. A warning (a limit near its threshold, a single rejected order, a market event) only stops new entries once unacknowledged; exits and stops keep running, and the daily loss limit and the drawdown halt still apply"
max_round_trips_per_symbol_per_day = 4
max_traded_pct_per_day = 300         # notional traded in a day, % of equity: beyond it, no new entries until the owner allows them
max_open_positions_guard = 50        # a check against a malfunction, not a limit on the strategy: at the planned sizes the limits hold 18 to 25 positions; reaching it stops new entries until the owner allows them
api_reserve_pct = 30                 # of the broker's request budget, kept free for exits and reconciliation
max_clock_error_ms = 50              # the host clock against UTC: beyond it, no risk-increasing orders
report_deadline_new_york = "17:00"

[live]
review_every_trading_days = 5        # the owner's weekly review
retire_check_every_trading_days = 21 # the live test looks at the record each month
test_h1_sr = 1.5                     # the live test weighs "no edge" against this edge (the target)
test_cap_llr = 2.89                  # its log-likelihood ratio is capped here (ln 18), so a long good run can't hide a decay
test_stop_llr = -2.5                 # at or below this (12 to 1 for "no edge") the strategy stops
test_halve_llr = -1.1                # at or below this (ln 1/3) capital halves
test_grow_llr = 0                    # capital may grow only at or above this
forward_validation_days = 60         # a changed strategy runs this long on paper before it replaces the live one

[[objectives]]
id = "O1"
kind = "achieve"
title = "Edge"
statement = "Make money after every cost, with a return beyond the market's moves that the evidence shows is not luck."
question = "Does the strategy, judged on data it was not built on, earn more than its costs and more than the market's moves would give, by more than chance explains?"

[[objectives]]
id = "O2"
kind = "maintain"
title = "Capital protection"
statement = "Keep every loss inside the fixed limits at all times."
question = "Do the limits hold on every order and every day, including through gaps, outages and the kill switch?"

[[objectives]]
id = "O3"
kind = "maintain"
title = "Active within the horizon"
statement = "Look for trades through every session and trade whenever the expected gain pays for the cost, within the allowed holding periods."
question = "Does the system watch the whole universe all session, trade when and only when the entry rule says so, and close within the holding limits?"

[[objectives]]
id = "O4"
kind = "maintain"
title = "Autonomy and resilience"
statement = "Run unattended through each regular session and, on any fault, go to the safe state."
question = "Does the system run without a person, agree with the broker, and fail into the safe state?"

[[objectives]]
id = "O5"
kind = "avoid"
title = "Lawful conduct"
statement = "Never send an order the rules forbid."
question = "Does any order break a market rule, the broker's rules, or the system's own rules on message rates?"

[[objectives]]
id = "O6"
kind = "maintain"
title = "Honest evidence"
statement = "Judge every result in a way that cannot fool us."
question = "Is every variant counted, every result reproducible, and every gate challenged by someone independent?"

[[objectives]]
id = "O7"
kind = "maintain"
title = "Accountability"
statement = "Record why every order was sent, show live profit and loss, and report every trading day."
question = "Can the owner see, at any moment and after the fact, what the system did and why?"

[[objectives]]
id = "O8"
kind = "maintain"
title = "Improve and retire"
statement = "Review strategies every week, change them only through the same evidence, and retire a strategy whose live results fall short."
question = "Does the system get better without fooling itself, and stop a strategy whose edge has gone?"

# --- key results: metric, unit, comparator, threshold, window, data, verification method, gate ---

[[key_results]]
id = "KR1.1"
objective = "O1"
kpp = true
statement = "The out-of-sample net excess return has a Deflated Sharpe Ratio of at least 0.95, counting every variant tried."
metric = "Deflated Sharpe Ratio of daily net excess returns"
unit = "probability"
comparator = ">="
threshold = 0.95
window = "at least 2,400 trading days of walk-forward out-of-sample history"
data = "historical consolidated bars and quotes; the trial log"
method = "analysis"
gate = "G1"

[[key_results]]
id = "KR1.2"
objective = "O1"
kpp = true
statement = "The out-of-sample annualized net excess Sharpe ratio is at least 1.0."
metric = "annualized Sharpe ratio of daily net excess returns"
unit = "ratio"
comparator = ">="
threshold = 1.0
objective_value = 1.5
window = "the G1 out-of-sample history"
data = "historical consolidated bars and quotes"
method = "analysis"
gate = "G1"

[[key_results]]
id = "KR1.3"
objective = "O1"
kpp = false
statement = "With every cost 50% higher, the out-of-sample annualized net excess Sharpe ratio stays at or above 0.5."
