# --- gates: the rule each one applies, as goaltests/gates.py defines it ---

[[gates]]
id = "G1"
name = "Research on history"
purpose = "Is there an edge, net of costs, on history not used to find it?"
[gates.rule]
kind = "dsr"
metric = "excess"
min_days = 2400
min_trials = 20
dsr_min = 0.95
sr_min = 1.0
min_sr_each_half = 0.25
stress_sr_min = 0.5
plausibility_sr_max = 4.0
require_lag_audit = true
require_net_profit = true
autocorr_lags = 5
require_conservative_fills = true
min_rotations_judged = 50            # a strategy that rotates is judged on at least this many out-of-sample rotations (KR3.6)
rotation_confidence = 0.90           # and the one-sided lower bound of their mean value at this confidence must be above zero

[[gates]]
id = "G2"
name = "Paper trading"
purpose = "Does the live system do what the tested strategy does, unattended and within every limit, and does it make money on paper once paper's generous fills are corrected? (It can't prove the edge: 120 days are too few.)"
[gates.rule]
kind = "paper"
metric = "excess"
min_days = 120
min_risk_trades = 300
max_days_to_trades = 150
max_drawdown_pct = 10.0
rule_breaches = 0
fidelity_margin_sr = 0.3
fidelity_alpha = 0.05
min_trade_match = 0.95
require_net_profit = true
autocorr_lags = 5
require_conservative_fills = true

[[gates]]
id = "G3"
name = "Real money, small first"
purpose = "Do real fills match the cost model, with real money at risk?"
[gates.rule]
kind = "owner_decision"
max_initial_capital_fraction = 0.10
min_initial_capital_usd = 2500       # short sales need $2,000 of equity, and this keeps it through a 10% drawdown
min_shares_typical_position = 10     # the starting capital lets a typical position hold this many shares of the universe's median-priced stock, so whole shares stay within 10% of the tested sizes
human_review_capital_usd = 100000    # capital grows past this only after a paid human expert, paid whatever the verdict, has reviewed the G1 statistics
min_days = 60
scale_rule = "capital at most doubles each 60 trading days, and only while the live test allows growth (KR8.2), every G2 criterion still holds, live costs match the model (KR1.8), and no participation limit binds on more than 5% of trades; it grows past human_review_capital_usd only after the human review"
entry_conditions = "the owner has confirmed the tax treatment of the account with an adviser: for a US taxpayer, how wash sales are tracked across all the owner's accounts (the broker applies the rule only within one account) and whether to elect mark-to-market accounting under section 475(f), which must be made before the tax year it applies to; for a taxpayer elsewhere, how the home country taxes frequent trading. The starting capital is at least min_initial_capital_usd and lets a typical position hold min_shares_typical_position shares of the universe's median-priced stock; if max_initial_capital_fraction of the intended capital is less, the first step starts at that minimum instead, and the owner accepts that it is not small"

# --- controls: each covers items of the external checklists GT-7 applies ---

[[controls]]
id = "C1"
statement = "Before every order, limits are computed on the positions the broker has confirmed plus every open or unconfirmed order as if filled: buying power, gross, overnight and industry exposure, open risk and the daily loss limit (new open risk at most the day's remaining loss budget divided by 1.25). An order that would exceed one is blocked."
covers = ["MA-1", "RT-9"]

[[controls]]
id = "C2"
statement = "A risk-increasing order is a limit order at most price_collar_pct through the consolidated best bid or offer, sent only on a quote at most data_max_age_seconds old, neither crossed nor locked, with a spread at most max_spread_multiple times the name's median, and within the position, dollar-volume and participation limits. A risk-reducing order is never blocked by a price, universe or event check, and is limited only to the exchange's price band."
covers = ["MA-2", "RT-2"]

[[controls]]
id = "C3"
statement = "An order identical to one sent in the last duplicate_window_seconds is blocked; the system sends at most max_orders_per_second orders a second and max_orders_per_minute a minute, and keeps api_reserve_pct of the broker's request budget for exits and reconciliation."
covers = ["MA-3", "RT-2", "KC-2"]

[[controls]]
id = "C4"
statement = "Before every session and every risk-increasing order: the event and corporate-action calendar, the short-sale rules (easy-to-borrow status, the Rule 201 test, short-interest limits) and the universe limits are checked."
covers = ["MA-4"]

[[controls]]
id = "C5"
statement = "Every fill is recorded as it arrives; positions, orders and cash are reconciled with the broker continuously from its trade-update stream, by a poll at least every 60 seconds, after any disconnect, after every restart and at every close. A mismatch, an order of unknown state or an order the system did not send blocks risk-increasing orders and alerts the owner; an order of unknown state is never sent again blind. Every record is kept at least 5 years, append-only and hash-chained, with a copy off the host."
covers = ["MA-5", "RT-4", "RT-11", "KC-3"]

[[controls]]
id = "C6"
statement = "A kill switch, available to the owner at any time and triggered automatically by the drawdown halt, cancels all orders and closes all positions; a second way to do it depends neither on the trading process, nor on its host, nor on a person being there: it closes everything through the broker when the trading process stops reporting for alert_seconds or the owner asks, and the broker's own controls remain a third way; both are drilled (the broker cancels nothing by itself when a client disconnects); the broker account's margin multiplier is set to the lowest value that allows the planned shorts, so the broker itself caps a runaway; only one instance of the system trades at a time; every order carries the strategy version that sent it."
covers = ["RT-1", "FN-4", "KC-2", "RT-8"]

[[controls]]
id = "C7"
statement = "Real-time monitoring alerts the owner within alert_seconds of a blocked or rejected order, a data gap, a lost connection, a reconciliation mismatch, or a limit at limit_warning_fraction of its threshold, and repeats an unacknowledged alert through a second channel after alert_repeat_minutes. A fault (fault_text) puts the system in the safe state at once, has every stop confirmed at the broker within stop_check_seconds, and, unacknowledged, closes every position after unacknowledged_flatten_minutes or at flatten_cutoff_new_york, whichever comes first; an unacknowledged warning stops new entries after unacknowledged_alert_minutes. This relaxes RTS 6 Article 16 (alerts within 5 seconds, a person monitoring) by the owner's choice of an unattended system."
covers = ["RT-3", "FN-4", "KC-1"]
deviations = ["RT-3: RTS 6 asks for alerts within 5 seconds and a person monitoring during trading; the goal allows 60 seconds and no person, because the owner wants an unattended system"]

[[controls]]
id = "C8"
statement = "Changes are versioned, registered, tested on history and then on paper for forward_validation_days before use, deployed only outside the session, and can be rolled back; nothing changes during a trading day; before each open, every component is checked to run the approved version; a written runbook covers every incident the alerts name."
covers = ["FN-2", "FN-3", "RT-5", "KC-4", "KC-5"]

[[controls]]
id = "C9"
statement = "Orders never cross the system's own orders, are never sent without intent to trade, and are not used to move the closing price; surveillance checks the logs daily."
covers = ["FN-5"]

[[controls]]
id = "C10"
statement = "The risks in GOAL.md's obstacle table are reviewed monthly, and the controls' effectiveness is reviewed in writing every quarter."
covers = ["FN-1", "MA-6", "RT-6"]

[[controls]]
id = "C11"
statement = "Broker credentials are kept outside the code and repository, paper and live keys are separate, only the trading process can read them, they are rotated every 90 days and at once on any suspicion, and the broker account uses multi-factor sign-in; an order the system did not send triggers the kill switch."
covers = ["RT-7"]

[[controls]]
id = "C13"
statement = "At most max_round_trips_per_symbol_per_day round trips in one name a day, at most max_traded_pct_per_day of equity traded in a day, and at most max_open_positions_guard open positions, a check against a malfunction rather than a limit on the strategy; reaching any of them stops new entries until the owner allows them again."
covers = ["RT-2", "RT-9", "KC-2"]

[[controls]]
id = "C14"
statement = "The host clock stays within max_clock_error_ms of UTC and is monitored; beyond it, no risk-increasing orders."
covers = ["RT-10"]

[[controls]]
id = "C12"
statement = "A panel of independent AI reviewers challenges the evidence before each gate (effective challenge, KR6.2), tested on planted flaws (KR6.5), with a paid human review before real money passes human_review_capital_usd; the sequential live test weighs the live results every month (KR8.2)."
covers = ["MR-1", "MR-2"]
