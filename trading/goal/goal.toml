data = "paper account fills, revalued with the conservative fill model"
method = "analysis"
gate = "G2"

[[key_results]]
id = "KR1.6"
objective = "O1"
kpp = true
statement = "Measured live trading cost per round trip does not exceed the cost model (one-sided 95% confidence)."
