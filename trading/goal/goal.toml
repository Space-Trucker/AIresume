gate = "G2"

[[key_results]]
id = "KR2.2"
objective = "O2"
kpp = true
statement = "When the equity of record falls 9% below its highest close, trading halts within 60 seconds."
metric = "seconds from the drawdown reaching 9% to the halt, in drills and in fact"
unit = "seconds"
