# The goal, machine-readable: the single source of every number in GOAL.md. The tests in goaltests/
# read this file; GT-1 checks that GOAL.md says the same. Percentages are of account equity.

[meta]
version = "2"
status = "revised after the goal tests; awaiting the owner's review"
date = "2026-10-15"

[intent]
mission = "An autonomous system that trades liquid US stocks and ETFs, long and short, over holding periods from minutes to five trading days. It earns a return beyond what market moves and chance would give, net of every cost, and never breaks its risk limits. It proves this on a paper account before any real money, and trades real money only when the owner decides, starting with a fraction of the intended capital."
viewpoint = "owner"
non_goals = [
  "competing on speed: market making, latency arbitrage, or any edge that depends on holds shorter than the edge horizon",
  "options, futures, crypto, currencies, OTC securities, and leveraged or inverse ETFs",
  "short sales of hard-to-borrow stocks",
  "orders outside the regular session, 09:30 to 16:00 New York time",
  "positions held longer than 5 trading days or 7 calendar days",
  "leverage: gross exposure above 100% of equity",
  "a promised return: the goal fixes how results are judged, not what they will be",
  "the system's architecture, data sources and code, which are decided after the goal",
  "tax optimization",
]

[[stakeholders]]
id = "S1"
name = "Owner"
needs = ["trading that runs by itself through every session", "a net return beyond the market and chance",
         "no real money until the evidence says so", "a daily account of what was done and why", "a way to stop everything at once"]

[[stakeholders]]
id = "S2"
name = "Broker (Alpaca)"
needs = ["orders within its margin, short-sale and rate rules", "positions reconciled with its records"]

[[stakeholders]]
id = "S3"
name = "Market and regulators"
needs = ["orderly markets", "no manipulative orders", "accurate records"]

[[stakeholders]]
id = "S4"
name = "Independent reviewer"
needs = ["evidence that can be reproduced", "every strategy variant tried, logged", "a say before each gate"]

[constraints]
starting_equity_usd = 100000        # the paper account's default; confirm on day one; limits are in % of equity
max_holding_trading_days = 5
max_holding_calendar_days = 7
directions = ["long", "short"]
order_session = "regular"
hold_through_earnings = false        # no position held through its issuer's scheduled earnings release
universe_min_price_usd = 5
universe_min_dollar_volume_usd = 20000000   # 20-day median daily dollar volume
universe_max_spread_bps = 10                # 20-day median quoted spread
universe_text = "US-listed common stocks and ETFs on national exchanges that meet the price, dollar-volume and spread limits, excluding leveraged and inverse ETFs; shorts only in names the broker lists as easy to borrow"

[risk]
risk_per_position_pct = 0.5          # loss at the stop for one position, all its fills together
stop_required = true                 # every position has a stop from the moment it opens
max_open_risk_pct = 1.5              # sum of the losses at the stops of all open positions
max_positions = 10
max_position_pct = 20                # notional of one position
typical_position_pct = 10            # planning value for GT-3
max_position_overnight_pct = 10
max_overnight_gross_pct = 25
max_gross_exposure_pct = 100         # long plus short
daily_loss_limit_pct = 2.0           # from the day's opening equity: then flat and no new entries that day
max_drawdown_halt_pct = 10.0         # from peak equity: then flat and halted until the owner decides
vol_target_daily_pct = 0.5           # standard deviation of daily P&L that sizing aims for
leverage_text = "gross exposure, long plus short, at most 100% of equity"

[costs]
round_trip_cost_bps = 8              # planning average; each trade is charged its own costs, below
stress_cost_multiplier = 2
cost_text = "each fill pays its quoted half-spread at the decision time, 1.5 bps slippage, and the SEC and FINRA fees on sales; a short held overnight pays the broker's borrow fee"
fill_model_text = "conservative: a limit order fills only when the price trades through its limit; a market order fills at the far side of the quote at the decision time, plus slippage"

[activity]
min_risk_trades_per_week = 10        # trades risking at least 0.1% of equity
planned_risk_trades_per_week = 25
typical_holding_minutes = 780        # two trading days
cost_budget_pct_per_year = 15        # costs paid, as % of equity per year
activity_text = "the system evaluates the eligible universe every minute of the regular session and opens a position only when its expected gain exceeds twice its cost"

[returns]
min_net_excess_sharpe = 1.0          # annualized; below this a strategy is not worth running
target_net_excess_sharpe = 1.5       # annualized; what the gates are sized to detect
edge_min_horizon_minutes = 150       # the edge must come from holds of 2.5 hours or more (GT-3)

[evaluation]
prior_edge_probability = 0.05        # chance a new candidate has a real net edge before testing (GT-8)
min_posterior = 0.80
published_edge_haircut = 0.5         # published effects counted at half their reported size or less
max_false_pass_g1 = 0.05
max_false_pass_g2 = 0.20
max_false_real_money = 0.005
min_power = 0.80
max_false_halt_per_year = 0.10
assumed_trials = 10                  # the trial budget for the whole program on one data history
assumed_cost_drag_daily_pct = 0.04   # 25 trades a week x 10% x 8 bps
simulation_reps = 400

[kill_criteria]
max_research_cycles = 4              # each cycle at most 3 pre-registered variants, within the trial budget
max_research_months = 9
drawdown = "a fall of max_drawdown_halt_pct from peak halts trading until the owner decides"
no_edge = "if no strategy passes G1 within the research budget, the program stops instead of trading anyway"

[[objectives]]
id = "O1"
kind = "achieve"
title = "Edge"
statement = "Earn a net excess return, after all costs, that the evidence shows is not luck."

[[objectives]]
id = "O2"
kind = "maintain"
title = "Capital protection"
statement = "Keep every loss inside the fixed limits at all times."

[[objectives]]
id = "O3"
kind = "maintain"
title = "Active within the horizon"
statement = "Trade every session within the allowed holding periods, as often as the edge pays for its costs."

[[objectives]]
id = "O4"
kind = "maintain"
title = "Autonomy and resilience"
statement = "Run unattended through each regular session and fail safe."

[[objectives]]
id = "O5"
kind = "avoid"
title = "Lawful conduct and accountability"
statement = "Never send an order the rules forbid, and record why every order was sent."

[[objectives]]
id = "O6"
kind = "maintain"
title = "Honest evidence"
statement = "Judge every result in a way that cannot fool us."

# --- key results: metric, unit, comparator, threshold, window, data, verification method, gate ---

[[key_results]]
id = "KR1.1"
objective = "O1"
kpp = true
statement = "The out-of-sample net excess return has a Deflated Sharpe Ratio of at least 0.95, counting every variant tried."
metric = "Deflated Sharpe Ratio of daily net excess returns"
unit = "probability"
comparator = ">="
threshold = 0.95
window = "at least 2,000 trading days of walk-forward out-of-sample history"
data = "historical consolidated bars and quotes; the trial log"
method = "analysis"
gate = "G1"

[[key_results]]
id = "KR1.2"
objective = "O1"
kpp = true
statement = "The out-of-sample annualized net excess Sharpe ratio is at least 1.0."
metric = "annualized Sharpe ratio of daily net excess returns"
unit = "ratio"
comparator = ">="
threshold = 1.0
objective_value = 1.5
window = "the G1 out-of-sample history"
data = "historical consolidated bars and quotes"
method = "analysis"
gate = "G1"

[[key_results]]
id = "KR1.3"
objective = "O1"
kpp = false
statement = "With every cost doubled, the out-of-sample annualized net excess Sharpe ratio stays at or above 0.5."
metric = "annualized Sharpe ratio of daily net excess returns at twice the cost model"
unit = "ratio"
comparator = ">="
threshold = 0.5
window = "the G1 out-of-sample history"
data = "historical consolidated bars and quotes"
method = "analysis"
gate = "G1"

[[key_results]]
id = "KR1.4"
objective = "O1"
kpp = true
statement = "Out-of-sample and paper results together give a Probabilistic Sharpe Ratio against zero of at least 0.99."
metric = "Probabilistic Sharpe Ratio of the combined daily net excess returns"
unit = "probability"
comparator = ">="
threshold = 0.99
window = "the G1 history plus at least 60 paper trading days, or 120 if the first 60 lose"
data = "paper account fills, revalued with the conservative fill model"
method = "analysis"
gate = "G2"

[[key_results]]
id = "KR1.5"
objective = "O1"
kpp = false
statement = "Paper results are not significantly below the G1 estimate (one-sided p of at least 0.05)."
metric = "one-sided p-value of paper mean daily excess return against the G1 estimate"
