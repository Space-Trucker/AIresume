# --- gates: the rule each one applies, as goaltests/gates.py defines it ---

[[gates]]
id = "G1"
name = "Research on history"
purpose = "Is there an edge, net of costs, on history not used to find it?"
[gates.rule]
kind = "dsr"
metric = "excess"
min_days = 2000
dsr_min = 0.95
stress_sr_min = 0.5
plausibility_sr_max = 4.0
require_conservative_fills = true

[[gates]]
id = "G2"
name = "Paper trading"
purpose = "Does the system work, live and unattended, and do its results match G1 once paper's generous fills are corrected?"
[gates.rule]
kind = "paper"
metric = "excess"
min_days = 60
extend_days = 60
min_risk_trades = 300
max_drawdown_pct = 10.0
rule_breaches = 0
shortfall_alpha = 0.05
combined_psr_min = 0.99
require_conservative_fills = true

[[gates]]
id = "G3"
name = "Real money, small first"
purpose = "Do real fills match the cost model, with real money at risk?"
[gates.rule]
kind = "owner_decision"
max_initial_capital_fraction = 0.10
min_days = 60
scale_rule = "capital at most doubles each 60 trading days, and only while every G2 criterion still holds and live costs match the model"

# --- controls: each covers items of the external checklists GT-7 applies ---

[[controls]]
id = "C1"
statement = "Before every order: buying power, gross and overnight exposure, open risk and the daily loss limit are checked, and an order that would exceed one is blocked."
covers = ["MA-1"]

[[controls]]
id = "C2"
statement = "Before every order: its size is within the position limits, a limit price is within 1% of the current quote, and its value is at most 20% of equity."
covers = ["MA-2", "RT-2"]

[[controls]]
id = "C3"
statement = "An order identical to one sent in the last 5 seconds is blocked, and the system sends at most 2 orders a second and 120 a minute."
covers = ["MA-3", "RT-2", "KC-2"]

[[controls]]
id = "C4"
statement = "Before every order: earnings blackout, easy-to-borrow status for shorts, and the universe limits are checked."
covers = ["MA-4"]

[[controls]]
id = "C5"
statement = "Every fill is recorded as it arrives; positions, orders and cash are reconciled with the broker after every restart and at every close."
covers = ["MA-5", "RT-4"]

[[controls]]
id = "C6"
statement = "A kill switch, available to the owner at any time and triggered automatically by the drawdown halt, cancels all orders and closes all positions; every order carries the strategy version that sent it."
covers = ["RT-1", "FN-4", "KC-2"]

[[controls]]
id = "C7"
statement = "Real-time monitoring alerts the owner within 60 seconds of a blocked or rejected order, a data gap, a lost connection or a limit near its threshold; alerts must be acknowledged."
covers = ["RT-3", "FN-4", "KC-1"]

[[controls]]
id = "C8"
statement = "Changes are versioned, tested on history and paper before use, deployed only outside the session, and can be rolled back; nothing changes during a trading day."
covers = ["FN-2", "FN-3", "RT-5"]

[[controls]]
id = "C9"
statement = "Orders never cross the system's own orders, are never sent without intent to trade, and are not used to move the closing price; surveillance checks the logs daily."
covers = ["FN-5"]

[[controls]]
id = "C10"
statement = "The risks in GOAL.md's obstacle table are reviewed monthly, and the controls' effectiveness is reviewed in writing every quarter."
covers = ["FN-1", "MA-6", "RT-6"]

[[controls]]
id = "C11"
statement = "Broker credentials are kept outside the code and repository, paper and live keys are separate, and only the trading process can read them."
covers = ["RT-7"]

[[controls]]
id = "C12"
statement = "An independent reviewer challenges the evidence before each gate (effective challenge), and live results are compared every month with what G1 and G2 predicted."
covers = ["MR-1", "MR-2"]
